<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quick Tools{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="brand" href="{{ url_for('scanner') }}">Quick Tools</a>

            <nav class="nav-menu" aria-label="Main menu">
                <a href="{{ url_for('scanner') }}">QR Scanner</a>
                <a href="{{ url_for('image_to_text') }}">Image to Text</a>
                <a href="{{ url_for('link_to_qr') }}">Link to QR</a>
                <a href="{{ url_for('link_shortener') }}">Link Shortener</a>
                <a href="{{ url_for('video_size_changer') }}">Video Size Changer</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="ad ad-top">
            <!-- PLACE GOOGLE ADSENSE CODE HERE -->
            Top banner ad space
        </div>

        <div class="page-layout">
            <main class="main-content">
                {% block content %}{% endblock %}
            </main>

            <aside class="ad ad-side">
                <!-- PLACE GOOGLE ADSENSE CODE HERE -->
                Side banner ad space
            </aside>
        </div>

        <div class="ad ad-bottom">
            <!-- PLACE GOOGLE ADSENSE CODE HERE -->
            Bottom banner ad space
        </div>
    </div>

    <footer class="site-footer">
        <div class="container footer-wrap">
            <p>© 2026 Quick Tools</p>
            <div>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('privacy') }}">Privacy Policy</a>
                <a href="{{ url_for('terms') }}">Terms</a>
                <a href="{{ url_for('contact') }}">Contact</a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
